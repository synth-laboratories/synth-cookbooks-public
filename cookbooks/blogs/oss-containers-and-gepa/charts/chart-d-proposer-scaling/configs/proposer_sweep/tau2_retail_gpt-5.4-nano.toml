# Chart D — Proposer scaling sweep: tau2_retail x gpt-5.4-nano proposer
#
# Boot the tau2_retail container on :8775 first, then run from repo root:
#   uv run synth-optimizers gepa run --config \
#     cookbooks/blogs/oss-containers-and-gepa/charts/chart-d-proposer-scaling/configs/proposer_sweep/tau2_retail_gpt-5.4-nano.toml

[run]
run_id = "tau2_retail_proposer_nano"
output_dir = "../../runs/final_20260603/tau2_retail_nano"
seed = 0

[container]
url = "http://127.0.0.1:8775"
startup_timeout_seconds = 60

[taskset]
train_split = "train"
heldout_split = "test"
train_ids = ["train:0", "train:1", "train:2", "train:3", "train:4", "train:5", "train:6", "train:7", "train:8", "train:9", "train:10", "train:11", "train:12", "train:13", "train:14", "train:15", "train:16", "train:17", "train:18", "train:19", "train:20", "train:21", "train:22", "train:23", "train:24", "train:25", "train:26", "train:27", "train:28", "train:29"]
heldout_ids = ["test:0", "test:1", "test:2", "test:3", "test:4", "test:5", "test:6", "test:7", "test:8", "test:9", "test:10", "test:11", "test:12", "test:13", "test:14", "test:15", "test:16", "test:17", "test:18", "test:19", "test:20", "test:21", "test:22", "test:23", "test:24", "test:25", "test:26", "test:27", "test:28", "test:29", "test:30", "test:31", "test:32", "test:33", "test:34", "test:35", "test:36", "test:37", "test:38", "test:39", "test:40", "test:41", "test:42", "test:43", "test:44", "test:45", "test:46", "test:47", "test:48", "test:49", "test:50", "test:51", "test:52", "test:53", "test:54", "test:55", "test:56", "test:57", "test:58", "test:59", "test:60", "test:61", "test:62", "test:63", "test:64", "test:65", "test:66", "test:67", "test:68", "test:69", "test:70", "test:71", "test:72", "test:73", "test:74", "test:75", "test:76", "test:77", "test:78", "test:79", "test:80", "test:81", "test:82", "test:83", "test:84", "test:85", "test:86", "test:87", "test:88", "test:89", "test:90", "test:91", "test:92", "test:93", "test:94", "test:95", "test:96", "test:97", "test:98", "test:99"]

[candidate]
target_modules = ["domain_policy"]

[seed_candidate]
domain_policy = "Use the retail policy exactly. Be concise, collect required information before taking actions, use tools when needed, and never promise an action unless it is allowed by policy."

[policy]
provider = "openai"
model = "gemini/gemini-3.1-flash-lite"
api_key_env = "GEMINI_API_KEY"

[proposer]
backend = "codex_app_server"
execution_mode = "local_process"
timeout_seconds = 900
model = "gpt-5.4-nano"
reasoning_effort = "low"
auth_mode = "api_key"
copy_host_auth = false
api_key_env = "OPENAI_API_KEY"

sandbox_mode = "workspace-write"
approval_policy = "never"

[gepa]
max_generations = 3
proposals_per_generation = 2
minibatch_size = 10
rollout_submission_mode = "sync"
rollout_chunk_size = 20
# Search-side rollout cap for this proposer cell.
# Search is capped by max_train_rollouts = budget. Internal heldout is pinned to
# the minimum (1) — it can't be 0 — and its result is ignored; heldout scoring is
# done uniformly afterwards by evaluate_heldout.py. max_total_rollouts carries
# headroom so the train cap is the binding constraint on search.
max_train_rollouts = 400
max_heldout_rollouts = 1
max_total_rollouts = 600
max_cost_usd = 0.0

[cache]
mode = "off"
path = "../../runs/final_20260603/tau2_retail_nano/cache.sqlite"
namespace = "tau2_retail_proposer_nano"
