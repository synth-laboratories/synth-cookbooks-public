# Chart D — Proposer scaling sweep: healthbench x gpt-5.4-nano proposer
#
# Boot the healthbench container on :8815 first, then run from repo root:
#   uv run synth-optimizers gepa run --config \
#     cookbooks/blogs/oss-containers-and-gepa/charts/chart-d-proposer-scaling/configs/proposer_sweep/healthbench_gpt-5.4-nano.toml

