[candidate]
target_modules = ["stage1_system"]

[seed_candidate]
stage1_system = "You are an expert physician. Answer the clinical question directly and accurately. Provide a clear, evidence-based response that addresses all aspects of the question. Include relevant considerations for diagnosis, treatment, or clinical management as appropriate. Be concise and precise."

[policy]
provider = "openai"
model = "google/gemini-2.5-flash-lite"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[proposer]
backend = "codex_app_server"
execution_mode = "local_process"
timeout_seconds = 900
model = "gpt-5.4-nano"
reasoning_effort = "low"
auth_mode = "api_key"
copy_host_auth = false
api_key_env = "OPENAI_API_KEY"

sandbox_mode = "workspace-write"
approval_policy = "never"

[gepa]
max_generations = 4
proposals_per_generation = 4
minibatch_size = 40
rollout_submission_mode = "sync"
rollout_chunk_size = 80
# Search-side rollout cap for this proposer cell.
# Search is capped by max_train_rollouts = budget. Internal heldout is pinned to
# the minimum (1) — it can't be 0 — and its result is ignored; heldout scoring is
# done uniformly afterwards by evaluate_heldout.py. max_total_rollouts carries
# headroom so the train cap is the binding constraint on search.
max_train_rollouts = 1400
max_heldout_rollouts = 1
max_total_rollouts = 1600
max_cost_usd = 0.0

[cache]
mode = "off"
path = "../../runs/final_20260603/healthbench_nano/cache.sqlite"
namespace = "healthbench_proposer_nano"
