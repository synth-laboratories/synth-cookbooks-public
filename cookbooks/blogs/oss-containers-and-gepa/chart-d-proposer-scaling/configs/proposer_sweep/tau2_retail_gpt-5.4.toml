# Chart D — Proposer scaling sweep: tau2_retail x gpt-5.4 proposer
#
# Boot the tau2_retail container on :8775 first, then run from repo root:
#   uv run synth-optimizers gepa run --config \
#     cookbooks/blogs/oss-containers-and-gepa/chart-d-proposer-scaling/configs/proposer_sweep/tau2_retail_gpt-5.4.toml

[run]
run_id = "tau2_retail_proposer_gpt54"
output_dir = "../../runs/final_20260603/tau2_retail_gpt54"
seed = 0

[container]
url = "http://127.0.0.1:8775"
startup_timeout_seconds = 5

[taskset]
train_split = "train"
heldout_split = "test"
train_ids = ["train:0", "train:1", "train:2", "train:3"]
heldout_ids = ["test:0", "test:1", "test:2", "test:3", "test:4"]

[candidate]
target_modules = ["domain_policy"]

[seed_candidate]
domain_policy = "Use the retail policy exactly. Be concise, collect required information before taking actions, use tools when needed, and never promise an action unless it is allowed by policy."

[policy]
provider = "openai"
model = "openrouter/google/gemini-3.1-flash-lite"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[proposer]
backend = "codex_app_server"
execution_mode = "local_process"
timeout_seconds = 900
model = "gpt-5.4"
reasoning_effort = "high"
auth_mode = "chatgpt"
codex_home = "/Users/joshpurtell/.codex_chatgpt_jmvpurtell"
copy_host_auth = false
sandbox_mode = "workspace-write"
approval_policy = "never"

[gepa]
max_generations = 3
proposals_per_generation = 2
minibatch_size = 2
max_total_rollouts = 60
max_cost_usd = 0.0

[cache]
mode = "off"
path = "../../runs/final_20260603/tau2_retail_gpt54/cache.sqlite"
namespace = "tau2_retail_proposer_gpt54"
