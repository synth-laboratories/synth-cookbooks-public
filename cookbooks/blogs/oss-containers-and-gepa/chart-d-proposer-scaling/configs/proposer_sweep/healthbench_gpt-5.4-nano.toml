# Chart D — Proposer scaling sweep: healthbench x gpt-5.4-nano proposer
#
# Boot the healthbench container on :8815 first, then run from repo root:
#   uv run synth-optimizers gepa run --config \
#     cookbooks/blogs/oss-containers-and-gepa/chart-d-proposer-scaling/configs/proposer_sweep/healthbench_gpt-5.4-nano.toml

[run]
run_id = "healthbench_proposer_nano"
output_dir = "../../runs/final_20260603/healthbench_nano"
seed = 0

[container]
url = "http://127.0.0.1:8815"
startup_timeout_seconds = 5

[taskset]
train_split = "train"
heldout_split = "test"
train_ids = ["train:0", "train:1", "train:2", "train:3", "train:4", "train:5", "train:6", "train:7", "train:8", "train:9"]
heldout_ids = ["test:0", "test:1", "test:2", "test:3", "test:4", "test:5", "test:6", "test:7", "test:8", "test:9", "test:10", "test:11", "test:12", "test:13", "test:14", "test:15", "test:16", "test:17", "test:18", "test:19", "test:20", "test:21", "test:22", "test:23", "test:24"]

[candidate]
target_modules = ["stage1_system"]

[seed_candidate]
stage1_system = "You are an expert physician. Answer the clinical question directly and accurately. Provide a clear, evidence-based response that addresses all aspects of the question. Include relevant considerations for diagnosis, treatment, or clinical management as appropriate. Be concise and precise."

[policy]
provider = "openai"
model = "google/gemini-2.5-flash-lite"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[proposer]
backend = "codex_app_server"
execution_mode = "local_process"
timeout_seconds = 900
model = "gpt-5.4-nano"
reasoning_effort = "low"
auth_mode = "api_key"
copy_host_auth = false
api_key_env = "OPENAI_API_KEY"

sandbox_mode = "workspace-write"
approval_policy = "never"

[gepa]
max_generations = 3
proposals_per_generation = 2
minibatch_size = 5
max_total_rollouts = 200
max_cost_usd = 0.0

[cache]
mode = "off"
path = "../../runs/final_20260603/healthbench_nano/cache.sqlite"
namespace = "healthbench_proposer_nano"
