[project]
name = "banking77-gepa-evals"
version = "0.1.0"
description = "Synth GEPA vs gepa-ai comparison pipeline for Banking77."
requires-python = ">=3.11"
dependencies = [
  "gepa>=0.1.1",
  "httpx>=0.27",
  "matplotlib>=3.10.9",
  "openai>=1.0",
  # gepa is optional — needed for gepa_ai stack runs.
  # Install: uv add gepa
  # synth-optimizers is optional — needed for synth_gepa stack runs.
  # Install: uv add "synth-optimizers @ git+https://github.com/synth-laboratories/optimizers.git"
  "synth-optimizers",
]

[tool.uv.sources]
# Local editable source — needed for the DeepSeek proposer backend
# (deepseek_chat, PR #4), which is not in the pinned git rev / released wheel.
synth-optimizers = { path = "../../../../../optimizers", editable = true }
