# FAST sanity check: high-confusability 7-label split (transfer/top-up status).
# ~3-4 min vs ~13 for full banking77 — concentrated hard cases, lower baseline,
# more headroom, far fewer rollouts. Run: ./run_gepa.sh --cfg configs/banking77_confusable7.toml

# Banking77 GEPA — public-cookbook-scale counts (sanity + meaningful search).
# Run: ./run_gepa.sh --cfg configs/banking77.toml
[run]
run_id = "banking77_confusable7"
output_dir = "runs"
seed = 0

[container]
url = "http://127.0.0.1:8765"
command = [
  "/usr/bin/env",
  "BANKING77_TRAIN_SAMPLE=56",
  "BANKING77_LABELS=pending_transfer,failed_transfer,transfer_not_received_by_recipient,transfer_timing,pending_top_up,top_up_failed,top_up_reverted",
  "BANKING77_TEST_SAMPLE=140",
  "BANKING77_POLICY_CONCURRENCY=120",
  "BANKING77_POLICY_MODEL=meta-llama/llama-3.2-3b-instruct",
  "BANKING77_POLICY_TIMEOUT_SECONDS=30",
  "BANKING77_POLICY_MAX_TOKENS=16",
  "BANKING77_POLICY_RETRIES=2",
  "BANKING77_POLICY_BASE_URL=https://openrouter.ai/api/v1",
  "uv", "run", "--project", "banking77_container",
  "python", "banking77_container/synth_service_app.py",
  "--host", "127.0.0.1", "--port", "8765",
]
cwd = "."
startup_timeout_seconds = 120

[taskset]
train_split = "train"
heldout_split = "test"
train_ids = [
  "train:0", "train:1", "train:2", "train:3", "train:4", "train:5", "train:6", "train:7",
