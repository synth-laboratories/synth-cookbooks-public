[candidate]
target_modules = ["system_prompt"]

[seed_candidate]
system_prompt = "You are a careful health assistant. Give accurate, relevant, and safe guidance. State uncertainty, ask useful follow-up questions, and recommend appropriate professional or emergency care when warranted."

[policy]
enabled = true
provider = "groq"
model = "llama-3.1-8b-instant"
api_key_env = "GROQ_API_KEY"
policy_type = "dag"
api_family = "chat_completions"
base_url = "https://api.groq.com/openai/v1"
max_tokens = 1536
disable_reasoning = "auto"
tool_call_style = "none"
proxy_mode = "proxy_only"
credential_mode = "byok"

[proposer]
backend = "codex_app_server"
runtime_substrate = "local"
execution_mode = "local_process"
provider = "openai"
api_family = "chat_completions"
model = "gpt-5.6-luna"
reasoning_effort = "medium"
auth_mode = "chatgpt"
copy_host_auth = true
codex_home = "/Users/joshuapurtell/.codex"
timeout_seconds = 900
sandbox_mode = "workspace-write"
approval_policy = "never"

[proposer.nano_codex]
enabled = false
mode = "live"
max_turns_per_session = 16
allowed_tools = ["search", "read", "apply_patch", "exec"]

[gepa]
max_generations = 2
proposals_per_generation = 2
minibatch_size = 20
minibatch_accept_margin = 0.0
max_total_rollouts = 750
rollout_failure_rate_tolerance = 0.15
max_train_rollouts = 460
max_heldout_rollouts = 250
rollout_chunk_size = 12
proposer_estimated_cost_usd = 0.15
rollout_estimated_cost_usd = 0.005
max_cost_usd = 3.9
rollout_submission_mode = "async"
rollout_poll_interval_ms = 250
rollout_async_timeout_seconds = 600
frontier_type = "per_example"
acceptance_criterion = "primary_improvement"

[gepa.pipeline]
mode = "sync_serial"
staleness_policy = "full"
delta_max = 2
max_in_flight_candidates = 1

[gepa.pipeline.workers]
propose = 1
rollout = 3
evaluate = 1

[gepa.pipeline.adaptive_rollout_concurrency]
enabled = true
initial = 3
min = 1
max = 3
increase_step = 5
decrease_step = 5
increase_after_successes = 20

[gepa.pipeline.speculative_completion]
enabled = false
alpha = 0.25

[gepa.pipeline.adaptive_stage_workers]
enabled = false
min = 1
max = 128
backlog_threshold = 2
stale_gap_threshold = 2

