[project]
name = "healthbench2-gepa-container"
version = "0.1.0"
description = "Public HealthBench 2 GEPA container using the normalized synth-containers runtime."
requires-python = ">=3.11"
dependencies = [
  "synth-containers @ git+https://github.com/synth-laboratories/containers.git@91ba87c1e29d841c61e0c22030380940107ccbd0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]
