[project]
name = "healthbench2-gepa-container"
version = "0.1.0"
description = "Public HealthBench 2 GEPA container using the normalized synth-containers runtime."
requires-python = ">=3.11"
dependencies = [
  "synth-containers @ git+https://github.com/synth-laboratories/containers.git@6fa210fe92076cd0b36e532d6b83af6c5e3863cf",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]
