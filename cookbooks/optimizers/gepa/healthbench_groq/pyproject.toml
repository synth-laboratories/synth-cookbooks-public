[project]
name = "healthbench2-gepa-container"
version = "0.1.0"
description = "Public HealthBench 2 GEPA container using the normalized synth-containers runtime."
requires-python = ">=3.11"
dependencies = [
  "synth-containers @ git+https://github.com/synth-laboratories/containers.git@7f6d84e10d66c6bd3045a8d0fdeb11bef5c97295",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]
