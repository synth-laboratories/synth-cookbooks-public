[run]
run_id = "tau2_retail_gepa_openrouter_codex_smoke"
output_dir = "../runs"
seed = 0

[container]
url = "http://127.0.0.1:8774"
command = [
  "/usr/bin/env",
  "OPENAI_BASE_URL=https://openrouter.ai/api/v1",
  "TAU2_RETAIL_AGENT_MODEL=openai/gpt-4.1-nano",
  "TAU2_RETAIL_USER_MODEL=openai/gpt-4.1-nano",
  "TAU2_RETAIL_MAX_STEPS=8",
  "uv", "run", "--project", "tau2_retail_container", "--python", "3.12",
  "python", "tau2_retail_container/synth_service_app.py",
  "--host", "127.0.0.1", "--port", "8774",
]
cwd = ".."
startup_timeout_seconds = 60

[dataset]
train_split = "train"
heldout_split = "test"
train_seeds = [0]
heldout_seeds = [0]

[candidate]
target_modules = ["domain_policy"]

[seed_candidate]
domain_policy = "Use the retail policy exactly. Be concise, collect required information before taking actions, use tools when needed, and never promise an action unless it is allowed by policy."

[policy]
provider = "openai"
model = "openai/gpt-4.1-nano"
api_key_env = "OPENAI_API_KEY"

[proposer]
backend = "codex_app_server"
execution_mode = "local_process"
timeout_seconds = 900
model = "gpt-5.4-mini"
reasoning_effort = "medium"
auth_mode = "chatgpt"
codex_home = "/Users/joshpurtell/.codex_chatgpt_jmvpurtell"
copy_host_auth = false
sandbox_mode = "workspace-write"
approval_policy = "never"

[gepa]
max_generations = 1
proposals_per_generation = 1
minibatch_size = 1
max_total_rollouts = 2
max_cost_usd = 0.0

[gepa.pipeline]
mode = "async_pipelined"
max_in_flight_candidates = 1

[gepa.pipeline.workers]
rollout = 1

[cache]
mode = "off"
path = "../runs/tau2_retail_gepa_openrouter_codex_smoke_cache.sqlite"
namespace = "tau2_retail_gepa_openrouter_codex_smoke"
