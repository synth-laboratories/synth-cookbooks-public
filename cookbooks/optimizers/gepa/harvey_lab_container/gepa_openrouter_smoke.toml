[run]
run_id = "harvey_lab_tax_gepa_openrouter_codex_smoke"
output_dir = "../runs"
seed = 0

[container]
url = "http://127.0.0.1:8772"
command = [
  "/usr/bin/env",
  "OPENAI_BASE_URL=https://openrouter.ai/api/v1",
  "HARVEY_LAB_POLICY_MODEL=openai/gpt-4.1-nano",
  "HARVEY_LAB_JUDGE_MODEL=openai/gpt-4.1-mini",
  "uv", "run", "--project", "harvey_lab_container",
  "python", "harvey_lab_container/synth_service_app.py",
  "--host", "127.0.0.1", "--port", "8772",
]
cwd = ".."
startup_timeout_seconds = 60

[dataset]
train_split = "train"
heldout_split = "test"
train_seeds = [0]
heldout_seeds = [0]

[candidate]
target_modules = ["system_prompt"]

[seed_candidate]
system_prompt = "You are a meticulous law-firm associate. You are given a client matter with a document data room and a partner's instructions. Read the relevant documents, do the legal analysis, and produce a precise, well-supported work product. Cite specific documents and facts; do not invent authorities."

[policy]
provider = "openai"
model = "openai/gpt-4.1-nano"
api_key_env = "OPENAI_API_KEY"

[proposer]
backend = "codex_app_server"
execution_mode = "local_process"
timeout_seconds = 900
model = "gpt-5.4-mini"
reasoning_effort = "medium"
auth_mode = "chatgpt"
codex_home = "/Users/joshpurtell/.codex_chatgpt_jmvpurtell"
copy_host_auth = false
sandbox_mode = "workspace-write"
approval_policy = "never"

[gepa]
max_generations = 1
proposals_per_generation = 1
minibatch_size = 1
max_total_rollouts = 2
max_cost_usd = 0.0

[gepa.pipeline]
mode = "async_pipelined"
max_in_flight_candidates = 1

[gepa.pipeline.workers]
rollout = 1

[cache]
mode = "off"
path = "../runs/harvey_lab_tax_gepa_openrouter_codex_smoke_cache.sqlite"
namespace = "harvey_lab_tax_gepa_openrouter_codex_smoke"
