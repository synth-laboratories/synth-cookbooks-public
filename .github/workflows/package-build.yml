name: Cookbook contracts

on:
  pull_request:
    paths: ["cookbooks/optimizers/gepa/**", ".github/workflows/package-build.yml", "packages/README.md"]
  push:
    branches: [main, dev, staging, jp/v010-cookbook-schema]
    paths: ["cookbooks/optimizers/gepa/**", ".github/workflows/package-build.yml", "packages/README.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.11"
      - name: Syntax and credential-free provider configuration
        run: |
          uv run --no-project --python 3.11 python -m compileall -q cookbooks/optimizers/gepa
          uv run --no-project --python 3.11 python cookbooks/optimizers/gepa/healthbench_groq/test_provider_config.py
          for script in cookbooks/optimizers/gepa/*/run_fresh_gepa.sh; do bash -n "$script"; done
      - name: Banking77 contracts against published Containers
        run: uv run --project cookbooks/optimizers/gepa/banking77_container --python 3.11 --with pytest pytest cookbooks/optimizers/gepa/banking77_container/test_contract.py -q
