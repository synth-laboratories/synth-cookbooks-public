[project]
name = "synth-cookbooks-public"
version = "0.6.0"
description = "Canonical public Synth cookbooks"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27",
  "fastapi>=0.110",
]

[project.scripts]
synth-cookbooks = "cookbook_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/cookbook_tools"]

[tool.pytest.ini_options]
testpaths = ["tests", "cookbooks"]
pythonpath = ["packages"]
addopts = "-q"
markers = [
  "live_container: talks to synth_containers in-process",
  "mlx_service: talks to synth_mlx_rl fake or live service",
]

[tool.uv]
package = true
